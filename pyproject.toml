[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-harness"
version = "0.2.0"
description = "Deterministic evals for tool-calling agents: grade what the agent did to the world, not what it said."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "João Paulo Lomba", email = "joaolombadev@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
claude = ["anthropic>=0.40"]
mcp = ["mcp>=2.3"]
dev = [
    "agent-eval-harness[api,claude,mcp]",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
agent-evals = "agent_evals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
