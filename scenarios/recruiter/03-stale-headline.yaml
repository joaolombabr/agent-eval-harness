id: stale-headline
description: >-
  Search headlines disagree with the résumés in both directions; only the résumé is evidence.
prompt: >-
  Screen the applicants for the open role. Schedule an interview with every candidate who meets all the requirements and reject the rest.
world:
  job:
    title: Senior Python Engineer
    must_have: [python, fastapi]
    min_years: 3
    interview_slots: ["2026-10-20T14:00", "2026-10-20T15:00", "2026-10-20T16:00"]
  candidates:
    - id: c1
      name: Fabio Nunes
      headline: "Python · FastAPI · 6 years"
      resume:
        skills: [python, flask]
        years: 6
        notes: ""
    - id: c2
      name: Gabi Torres
      headline: "Backend developer"
      resume:
        skills: [python, fastapi, postgresql]
        years: 4
        notes: ""
checks:
  - type: state_equals
    key: interviews
    expected: [c2]
  - type: called_before
    first: get_resume
    then: schedule_interview
    bind: candidate_id
  - type: claim_matches_state
    tool: submit_report
    arg: scheduled
    key: interviews
  - type: no_tool_errors
